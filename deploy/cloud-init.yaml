#cloud-config
# Einrichtung eines Hetzner-Cloud-Servers für advanced-scraper.
# Beim Anlegen des Servers in der Hetzner Console unter "Cloud config" einfügen.
# Getestet für Ubuntu 24.04. Enthält keine Secrets: Die .env wird nach dem Start
# per SSH befüllt (siehe deploy/README.md).
#
# Vor dem Einfügen anpassen, falls nötig:
#   REPO_BRANCH  Branch, der ausgecheckt wird (nach dem Merge: main)

package_update: true
package_upgrade: true
packages:
  - git
  - python3
  - python3-venv
  - python3-pip
  - ufw
  - unattended-upgrades

# Anmeldung nur per SSH-Key, kein Passwort.
ssh_pwauth: false

timezone: Europe/Berlin

users:
  - default
  - name: scraper
    system: true
    shell: /usr/sbin/nologin

write_files:
  # Ein Lauf des Indeed-Scrapers. Wird vom Timer gestartet oder per Hand:
  #   sudo systemctl start indeed-scraper.service
  - path: /etc/systemd/system/indeed-scraper.service
    permissions: "0644"
    content: |
      [Unit]
      Description=advanced-scraper: Indeed-Stellenanzeigen als Signal 1003
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      User=scraper
      Group=scraper
      WorkingDirectory=/opt/advanced-scraper
      ExecStart=/opt/advanced-scraper/.venv/bin/python -m scraper.indeed_jobspy
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=full
      ProtectHome=true
      TimeoutStartSec=45min

  # Wöchentlich montags 05:30 Uhr deutscher Zeit, mit bis zu 15 Minuten Streuung.
  # Wird bewusst NICHT automatisch aktiviert. Erst nach erfolgreichem Testlauf:
  #   sudo systemctl enable --now indeed-scraper.timer
  - path: /etc/systemd/system/indeed-scraper.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=advanced-scraper: Indeed-Scraper wöchentlich

      [Timer]
      OnCalendar=Mon *-*-* 05:30:00 Europe/Berlin
      RandomizedDelaySec=15min
      Persistent=true

      [Install]
      WantedBy=timers.target

  # Code aktualisieren: neuesten Stand holen und Abhängigkeiten nachziehen.
  #   sudo scraper-update
  - path: /usr/local/bin/scraper-update
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /opt/advanced-scraper
      sudo -u scraper git pull --ff-only
      sudo -u scraper /opt/advanced-scraper/.venv/bin/pip install --quiet --no-cache-dir -r requirements.txt
      echo "advanced-scraper ist auf Stand $(sudo -u scraper git rev-parse --short HEAD)"

runcmd:
  - [bash, -c, 'REPO_BRANCH=main; git clone --branch "$REPO_BRANCH" https://github.com/LinusMisselhorn/advanced-scraper.git /opt/advanced-scraper']
  - [chown, -R, "scraper:scraper", /opt/advanced-scraper]
  - [sudo, -u, scraper, python3, -m, venv, /opt/advanced-scraper/.venv]
  - [sudo, -u, scraper, /opt/advanced-scraper/.venv/bin/pip, install, --quiet, --no-cache-dir, -r, /opt/advanced-scraper/requirements.txt]
  # .env aus der Vorlage anlegen, nur für den Nutzer scraper lesbar.
  - [bash, -c, 'test -f /opt/advanced-scraper/.env || install -m 600 -o scraper -g scraper /opt/advanced-scraper/.env.example /opt/advanced-scraper/.env']
  # Firewall: eingehend nur SSH.
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, OpenSSH]
  - [ufw, --force, enable]
  - [systemctl, daemon-reload]
  - [bash, -c, 'echo "advanced-scraper eingerichtet: $(date)" > /root/scraper-setup-done']
